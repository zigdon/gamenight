{{ template "base.html" }}
{{ $tab := "admin" }}
{{ define "Title" }}Edit Configuration{{ end }}
{{ define "Content" }}
<div class="row-fluid">
    <div class="span12">
        <form class="form-horizontal" method="post">
            {{ range $name, $val := .Config }}
                <div class="control-group">
                    <label class="control-label" for="config_{{ $name }}">{{ $name }}
                    {{ if .Flags.name }}
                        <span class="label label-success">Updated</span>
                    {{ else if .Flags.name eq nil }}
                        <span class="label label-danger">Failed</span>
                    {{ end }}</label>
                    <div class="controls">
                        <input type="text" id="config_{{ $name }}"
                               name="config_{{ $name }}" value="{{ $val }}"/>
                    </div>
                </div>
            {{ end }}
            <div class="control-group">
                <label class="control-label" for="new_entry">Add a new key</label>
                <div class="controls">
                    <input type="text" id="new_name" name="new_name"
                           placeholder="Name"/>
                    <input type="text" id="new_value" name="new_value"
                           placeholder="Value"/>
                </div>
            </div>
            <div class="control-group">
                <div class="controls">
                     <button type="submit" class="btn">Save</button>
                </div>
            </div>
        </form>
    </div>
</div>
{{ end }}
